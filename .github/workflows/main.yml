name: Build WhipClient

on:
  push:
    branches: [ master ]
  workflow_dispatch:

env:
  PROJECT_DIR: WhipClient-master/WhipClient-master
  CONFIGURATION: Release
  ARCH: x64            # اگه پروژه 32 بیتیه: Win32

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Show CMakeLists (for debugging)
        shell: pwsh
        run: Get-Content "$env:PROJECT_DIR/CMakeLists.txt" -TotalCount 60

      - name: Configure
        run: cmake -S "${{ env.PROJECT_DIR }}" -B build -G "Visual Studio 17 2022" -A ${{ env.ARCH }}

      - name: Build
        run: cmake --build build --config ${{ env.CONFIGURATION }} --parallel

      - name: List outputs
        shell: pwsh
        run: |
          Get-ChildItem build -Recurse -Include *.exe,*.dll,*.lib |
            Where-Object { $_.FullName -notmatch 'CMakeFiles' } |
            ForEach-Object { Write-Host $_.FullName }

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: WhipClient-${{ env.ARCH }}-${{ env.CONFIGURATION }}
          path: |
            build/**/${{ env.CONFIGURATION }}/*.exe
            build/**/${{ env.CONFIGURATION }}/*.dll
            build/**/${{ env.CONFIGURATION }}/*.lib
          if-no-files-found: warn
