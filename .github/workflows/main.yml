name: Build WhipClient

on:
  push:
    branches: [ master ]
  workflow_dispatch:

env:
  CONFIGURATION: Release
  ARCH: x64

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      # ── 1. WhipSysCall ────────────────────────────────────────────────────────
      - name: Build WhipSysCall
        shell: pwsh
        run: |
          $ws  = $env:GITHUB_WORKSPACE -replace '\\','/'
          $dir = "$ws/WhipSysCall-master/WhipSysCall-master"
          $out = "$dir/cmake-build-release"

          # Patch any hardcoded paths inside WhipSysCall before configure
          if (Test-Path "$dir/CMakeLists.txt") {
            $text = Get-Content "$dir/CMakeLists.txt" -Raw
            $text = $text -replace 'C:/Users/Java/Desktop/whip/WhipSysCall', $dir
            Set-Content "$dir/CMakeLists.txt" $text -NoNewline
          }

          cmake -S $dir -B $out -G "Visual Studio 17 2022" -A $env:ARCH
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cmake --build $out --config $env:CONFIGURATION --parallel
          if ($LASTEXITCODE -ne 0) { exit 1 }

          Write-Host "=== WhipSysCall outputs ==="
          Get-ChildItem $out -Recurse -Include *.lib,*.dll -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host $_.FullName }

      # ── 2. WhipNexus ─────────────────────────────────────────────────────────
      - name: Build WhipNexus
        shell: pwsh
        run: |
          $ws  = $env:GITHUB_WORKSPACE -replace '\\','/'
          $dir = "$ws/WhipNexus-Master/WhipNexus-Master"
          $out = "$dir/cmake-build-release"

          if (Test-Path "$dir/CMakeLists.txt") {
            # Patch any hardcoded paths
            $text = Get-Content "$dir/CMakeLists.txt" -Raw
            $text = $text -replace 'C:/Users/Java/Desktop/whip/WhipSysCall', "$ws/WhipSysCall-master/WhipSysCall-master"
            $text = $text -replace 'C:/Users/Java/Desktop/whip/WhipNexus',   $dir
            Set-Content "$dir/CMakeLists.txt" $text -NoNewline

            cmake -S $dir -B $out -G "Visual Studio 17 2022" -A $env:ARCH
            if ($LASTEXITCODE -ne 0) { exit 1 }
            cmake --build $out --config $env:CONFIGURATION --parallel
            if ($LASTEXITCODE -ne 0) { exit 1 }
          } else {
            $sln = Get-ChildItem $dir -Recurse -Filter *.sln | Select-Object -First 1
            if ($sln) {
              msbuild $sln.FullName /m /p:Configuration=$env:CONFIGURATION /p:Platform=$env:ARCH
              if ($LASTEXITCODE -ne 0) { exit 1 }
            } else {
              Write-Host "No build file in WhipNexus — skipping (will fail at link if needed)"
            }
          }

          Write-Host "=== WhipNexus outputs ==="
          Get-ChildItem $dir -Recurse -Include *.lib -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host $_.FullName }

      # ── 3. WhipAntiDebug ─────────────────────────────────────────────────────
      - name: Patch and Build WhipAntiDebug
        shell: pwsh
        run: |
          $ws      = $env:GITHUB_WORKSPACE -replace '\\','/'
          $dir     = "$ws/WhipAntiDebug-master/WhipAntiDebug-master"
          $out     = "$dir/cmake-build-release"
          $syscall = "$ws/WhipSysCall-master/WhipSysCall-master"

          $cm   = "$dir/CMakeLists.txt"
          $text = Get-Content $cm -Raw
          $text = $text -replace 'C:/Users/Java/Desktop/whip/WhipSysCall', $syscall
          $text = $text -replace 'C:\\Users\\Java\\Desktop\\whip\\WhipSysCall', $syscall
          Set-Content $cm $text -NoNewline
          Write-Host "Patched WhipAntiDebug CMakeLists.txt"

          cmake -S $dir -B $out -G "Visual Studio 17 2022" -A $env:ARCH
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cmake --build $out --config $env:CONFIGURATION --parallel
          if ($LASTEXITCODE -ne 0) { exit 1 }

          Write-Host "=== WhipAntiDebug outputs ==="
          Get-ChildItem $out -Recurse -Include *.lib -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host $_.FullName }

      # ── 4. Patch WhipClient CMakeLists.txt ───────────────────────────────────
      - name: Patch WhipClient CMakeLists.txt
        shell: pwsh
        run: |
          $ws  = $env:GITHUB_WORKSPACE -replace '\\','/'
          $cm  = "WhipClient-master/WhipClient-master/CMakeLists.txt"
          $text = Get-Content $cm -Raw

          $text = $text.Replace('C:/Users/Java/Desktop/whip/WhipNexus',         "$ws/WhipNexus-Master/WhipNexus-Master")
          $text = $text.Replace('C:/Users/Java/Desktop/whip/WhipSysCall',       "$ws/WhipSysCall-master/WhipSysCall-master")
          $text = $text.Replace('C:/Users/Java/CLionProjects/WhipAntiDebugger', "$ws/WhipAntiDebug-master/WhipAntiDebug-master")
          # VMProtect SDK is not present — disable it
          $text = $text -replace 'option\(BUILD_WITH_VMPROTECT\s+"[^"]+"\s+ON\)', 'option(BUILD_WITH_VMPROTECT "Build with VMProtect SDK" OFF)'

          Set-Content $cm $text -NoNewline

          $remaining = Select-String -Path $cm -Pattern 'C:/Users'
          if ($remaining) {
            Write-Host "WARNING — still hardcoded paths:"
            $remaining | ForEach-Object { Write-Host "  Line $($_.LineNumber): $($_.Line.Trim())" }
          } else {
            Write-Host "All paths patched OK"
          }

      # ── 5. Configure WhipClient ───────────────────────────────────────────────
      - name: Configure WhipClient
        run: |
          cmake -S "WhipClient-master/WhipClient-master" -B build ^
                -G "Visual Studio 17 2022" -A ${{ env.ARCH }} ^
                -DBUILD_WITH_VMPROTECT=OFF

      # ── 6. Build WhipClient ───────────────────────────────────────────────────
      - name: Build WhipClient
        run: cmake --build build --config ${{ env.CONFIGURATION }} --parallel

      # ── 7. List & Upload ──────────────────────────────────────────────────────
      - name: List outputs
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem build -Recurse -Include *.exe,*.dll -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch 'CMakeFiles' } |
            ForEach-Object { Write-Host $_.FullName }

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: WhipClient-x64-Release
          path: |
            build/**/Release/*.exe
            build/**/Release/*.dll
          if-no-files-found: warn
