name: Build WhipClient

on:
  push:
    branches: [ master ]
  workflow_dispatch:

env:
  CONFIGURATION: Release
  ARCH: x64

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2

      # ── 0. Stub VMProtect macros ──────────────────────────────────────────────
      - name: Stub VMProtect macros
        shell: pwsh
        run: |
          $ws = $env:GITHUB_WORKSPACE
          Get-ChildItem $ws -Recurse -Include *.cpp,*.c,*.h,*.hpp |
            Where-Object { $_.FullName -notmatch 'Thirdpary|ThirdParty|third_party|tests\\' } |
            ForEach-Object {
              $text = Get-Content $_.FullName -Raw -ErrorAction SilentlyContinue
              if ($text -and $text -match 'VMProtect') {
                $text = $text -replace 'VMProtectBeginMutation\s*\([^)]*\)\s*;',       '/* VMProtectBeginMutation stubbed */'
                $text = $text -replace 'VMProtectBeginVirtualization\s*\([^)]*\)\s*;', '/* VMProtectBeginVirtualization stubbed */'
                $text = $text -replace 'VMProtectBeginUltra\s*\([^)]*\)\s*;',          '/* VMProtectBeginUltra stubbed */'
                $text = $text -replace 'VMProtectBeginUltraLockByKey\s*\([^)]*\)\s*;', '/* VMProtectBeginUltraLockByKey stubbed */'
                $text = $text -replace 'VMProtectEnd\s*\(\s*\)\s*;',                   '/* VMProtectEnd stubbed */'
                $text = $text -replace '#\s*include\s*[<"]VMProtectSDK\.h[">]',        '/* VMProtectSDK.h stubbed */'
                Set-Content $_.FullName $text -NoNewline
                Write-Host "Patched: $($_.Name)"
              }
            }
          Write-Host "VMProtect stub pass complete."

      # ── 1. Build WhipSysCall ──────────────────────────────────────────────────
      - name: Build WhipSysCall
        shell: pwsh
        run: |
          $ws  = $env:GITHUB_WORKSPACE -replace '\\','/'
          $dir = "$ws/WhipSysCall-master/WhipSysCall-master"
          $out = "$dir/cmake-build-release"
          cmake -S $dir -B $out -G "Visual Studio 17 2022" -A $env:ARCH -DBUILD_WITH_VMPROTECT=OFF
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cmake --build $out --config $env:CONFIGURATION --parallel
          if ($LASTEXITCODE -ne 0) { exit 1 }

          # Ensure an include/ dir exists (WhipNexus references WhipSysCall/include)
          $inc = "$dir/include"
          if (-not (Test-Path $inc)) {
            Write-Host "include/ not found — creating junction to src/"
            New-Item -ItemType Junction -Path $inc -Target "$dir/src" | Out-Null
          }
          Write-Host "WhipSysCall.lib: $(Get-ChildItem $out -Recurse -Filter WhipSysCall.lib | Select -First 1 | % FullName)"
          Write-Host "include/ contents:"; Get-ChildItem $inc | % { Write-Host "  $($_.Name)" }
      # ── 2. Build WhipNexus ────────────────────────────────────────────────────
      - name: Build WhipNexus
        shell: pwsh
        run: |
          $ws       = $env:GITHUB_WORKSPACE -replace '\\','/'
          $dir      = "$ws/WhipNexus-Master/WhipNexus-Master"
          $out      = "$dir/cmake-build-release"
          $syscall  = "$ws/WhipSysCall-master/WhipSysCall-master"
          $antidebug= "$ws/WhipAntiDebug-master/WhipAntiDebug-master"

          if (-not (Test-Path "$dir/CMakeLists.txt")) {
            Write-Host "No CMakeLists.txt in WhipNexus — skipping"; exit 0
          }

          $cm   = "$dir/CMakeLists.txt"
          $text = Get-Content $cm -Raw

          # Absolute hardcoded paths
          $text = $text.Replace('C:/Users/Java/Desktop/whip/WhipSysCall',       $syscall)
          $text = $text.Replace('C:/Users/Java/Desktop/whip/WhipNexus',         $dir)
          $text = $text.Replace('C:/Users/Java/CLionProjects/WhipAntiDebugger', $antidebug)

          # Relative paths (${CMAKE_*}/../WhipSysCall → must replace whole token)
          $text = $text -replace '\$\{CMAKE_\w+\}[/\\]\.\.[/\\]WhipSysCall', $syscall
          $text = $text -replace '\$\{CMAKE_\w+\}[/\\]\.\.[/\\]WhipNexus',   $dir
          $text = $text -replace '\.\.[/\\]WhipSysCall', $syscall
          $text = $text -replace '\.\.[/\\]WhipNexus',   $dir

          # Fix Ninja generator in ExternalProject_Add — CLion hardcodes Ninja,
          # but we're running under Visual Studio 17 2022
          $text = $text -replace 'CMAKE_GENERATOR\s+"Ninja"',            'CMAKE_GENERATOR "Visual Studio 17 2022"'
          $text = $text -replace "CMAKE_GENERATOR\s+'Ninja'",            'CMAKE_GENERATOR "Visual Studio 17 2022"'
          $text = $text -replace '(ExternalProject_Add[^)]+?)CMAKE_ARGS', `
                         '$1CMAKE_GENERATOR "Visual Studio 17 2022"' + "`n    CMAKE_GENERATOR_PLATFORM `"x64`"`n    CMAKE_ARGS"

          # Remove any BINARY_DIR pointing to the WhipSysCall cmake-build-release
          # we already built — let ExternalProject use a fresh subdir instead
          # (avoids the "generator mismatch with existing cache" error)
          $text = $text -replace 'BINARY_DIR\s+"\$\{[^}]+\}/cmake-build-release"', `
                         "BINARY_DIR `"$out/whipsyscall-ep-build`""
          $text = $text -replace "BINARY_DIR\s+'\$\{[^}]+\}/cmake-build-release'", `
                         "BINARY_DIR `"$out/whipsyscall-ep-build`""

          Set-Content $cm $text -NoNewline

          # If ExternalProject still tries to use the same binary dir as our
          # already-built WhipSysCall, pre-delete its CMakeCache so it regenerates clean
          $scBuild = "$syscall/cmake-build-release"
          if (Test-Path "$scBuild/CMakeCache.txt") {
            Write-Host "Pre-clearing WhipSysCall CMakeCache to avoid generator conflict"
            Remove-Item "$scBuild/CMakeCache.txt" -Force
            Remove-Item "$scBuild/CMakeFiles" -Recurse -Force -ErrorAction SilentlyContinue
          }

          Write-Host "=== Remaining suspicious lines ==="
          Select-String -Path $cm -Pattern 'Ninja|C:/Users' |
            ForEach-Object { Write-Host "  line $($_.LineNumber): $($_.Line.Trim())" }

          cmake -S $dir -B $out -G "Visual Studio 17 2022" -A x64 -DBUILD_WITH_VMPROTECT=OFF
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cmake --build $out --config $env:CONFIGURATION --parallel
          if ($LASTEXITCODE -ne 0) { exit 1 }

          Write-Host "=== WhipNexus .lib files ==="
          Get-ChildItem $out -Recurse -Filter *.lib | ForEach-Object { Write-Host $_.FullName }
      # ── 3. Build WhipAntiDebug ────────────────────────────────────────────────
      - name: Build WhipAntiDebug
        shell: pwsh
        run: |
          $ws       = $env:GITHUB_WORKSPACE -replace '\\','/'
          $dir      = "$ws/WhipAntiDebug-master/WhipAntiDebug-master"
          $out      = "$dir/cmake-build-release"
          $syscall  = "$ws/WhipSysCall-master/WhipSysCall-master"
          $nexus    = "$ws/WhipNexus-Master/WhipNexus-Master"

          $cm   = "$dir/CMakeLists.txt"
          $text = Get-Content $cm -Raw
          $text = $text.Replace('C:/Users/Java/Desktop/whip/WhipSysCall',       $syscall)
          $text = $text.Replace('C:/Users/Java/Desktop/whip/WhipNexus',         $nexus)
          $text = $text.Replace('C:/Users/Java/CLionProjects/WhipAntiDebugger', $dir)
          $text = $text -replace '\$\{CMAKE_\w+\}/\.\./WhipSysCall', $syscall
          $text = $text -replace '\.\./WhipSysCall', $syscall
          $text = $text -replace '\$\{CMAKE_\w+\}/\.\./WhipNexus', $nexus
          $text = $text -replace '\.\./WhipNexus', $nexus
          Set-Content $cm $text -NoNewline

          cmake -S $dir -B $out -G "Visual Studio 17 2022" -A $env:ARCH -DBUILD_WITH_VMPROTECT=OFF
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cmake --build $out --config $env:CONFIGURATION --parallel
          if ($LASTEXITCODE -ne 0) { exit 1 }

          Write-Host "=== WhipAntiDebug .lib files ==="
          Get-ChildItem $out -Recurse -Filter *.lib | ForEach-Object { Write-Host $_.FullName }

      # ── 4. Patch WhipClient CMakeLists.txt ───────────────────────────────────
      - name: Patch WhipClient CMakeLists.txt
        shell: pwsh
        run: |
          $ws  = $env:GITHUB_WORKSPACE -replace '\\','/'
          $cm  = "WhipClient-master/WhipClient-master/CMakeLists.txt"
          $text = Get-Content $cm -Raw

          $text = $text.Replace('C:/Users/Java/Desktop/whip/WhipNexus',         "$ws/WhipNexus-Master/WhipNexus-Master")
          $text = $text.Replace('C:/Users/Java/Desktop/whip/WhipSysCall',       "$ws/WhipSysCall-master/WhipSysCall-master")
          $text = $text.Replace('C:/Users/Java/CLionProjects/WhipAntiDebugger', "$ws/WhipAntiDebug-master/WhipAntiDebug-master")
          $text = $text -replace 'option\(BUILD_WITH_VMPROTECT\s+"[^"]*"\s+ON\)', 'option(BUILD_WITH_VMPROTECT "Build with VMProtect SDK" OFF)'
          $text = $text -replace '\$\{CMAKE_\w+\}/\.\./WhipSysCall', "$ws/WhipSysCall-master/WhipSysCall-master"
          $text = $text -replace '\.\./WhipSysCall', "$ws/WhipSysCall-master/WhipSysCall-master"
          $text = $text -replace '\$\{CMAKE_\w+\}/\.\./WhipNexus', "$ws/WhipNexus-Master/WhipNexus-Master"
          $text = $text -replace '\.\./WhipNexus', "$ws/WhipNexus-Master/WhipNexus-Master"

          Set-Content $cm $text -NoNewline
          $left = Select-String -Path $cm -Pattern 'C:/Users'
          if ($left) { $left | ForEach-Object { Write-Host "HARDCODED line $($_.LineNumber): $($_.Line.Trim())" } }
          else { Write-Host "All paths patched OK" }

      # ── 5. Configure WhipClient ───────────────────────────────────────────────
      - name: Configure WhipClient
        shell: pwsh
        run: |
          cmake -S "WhipClient-master/WhipClient-master" -B build `
                -G "Visual Studio 17 2022" -A ${{ env.ARCH }} `
                -DBUILD_WITH_VMPROTECT=OFF

      # ── 6. Build WhipClient ───────────────────────────────────────────────────
      - name: Build WhipClient
        run: cmake --build build --config ${{ env.CONFIGURATION }} --parallel

      # ── 7. List & Upload ──────────────────────────────────────────────────────
      - name: List outputs
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem build -Recurse -Include *.exe,*.dll -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch 'CMakeFiles' } |
            ForEach-Object { Write-Host $_.FullName }

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: WhipClient-x64-Release
          path: |
            build/**/Release/*.exe
            build/**/Release/*.dll
          if-no-files-found: warn
