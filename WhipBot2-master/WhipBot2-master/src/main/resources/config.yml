# ============================================
# WhipBot Configuration
# ============================================
# Les variables d'environnement Docker override ces valeurs.
# En local (java -jar), ce fichier est utilisé directement.

token: ""
openai-api-key: ""
loader-path: "loader.exe"

# ============================================
# Database (override: DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD)
# ============================================
database:
  host: "localhost"
  port: 5432
  database: "whip"
  username: "whip"
  password: ""

# ============================================
# File Hosting (override: FILE_HOSTING_ENABLED, FILE_HOSTING_PORT, FILE_HOSTING_BASE_URL)
# ============================================
file-hosting:
  enabled: false
  port: 8080
  base-url: "http://localhost:8080"

