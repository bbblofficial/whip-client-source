name: Build & Deploy WhipSite

on:
  push:
    branches:
      - master  # Deploy PROD
      - dev     # Deploy DEV
  pull_request:
    branches:
      - master
      - dev
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'build'
        type: choice
        options:
          - build
          - deploy
          - build-and-deploy
      environment:
        description: 'Environment to deploy'
        required: false
        default: 'prod'
        type: choice
        options:
          - prod
          - dev
      tag:
        description: 'Image tag (for deploy)'
        required: false
        default: 'latest'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: whip-site
  NODE_VERSION: '18'
  IMAGE_OWNER: whip-industries

jobs:
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action != 'deploy')
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
      sha_short: ${{ steps.vars.outputs.sha_short }}
      branch: ${{ steps.branch.outputs.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get branch name
        id: branch
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "name=${{ github.head_ref }}" >> $GITHUB_OUTPUT
          else
            echo "name=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT
          fi

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set variables
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            COMMIT_SHA=${{ steps.vars.outputs.sha_short }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}

      - name: Summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | \`${{ steps.meta.outputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| SHA | \`${{ steps.vars.outputs.sha_short }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ steps.branch.outputs.name }}\` |" >> $GITHUB_STEP_SUMMARY

  deploy-prod:
    name: Deploy to PROD
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: read
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action != 'build' && github.event.inputs.environment == 'prod')

    steps:
      - name: Determine tag
        id: config
        run: |
          if [ "${{ github.event_name }}" == "release" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ needs.build.outputs.image_tag || 'latest' }}" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to VPS PROD
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ env.IMAGE_OWNER }}
          IMAGE_TAG: ${{ steps.config.outputs.tag }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_TOKEN,GITHUB_USERNAME,IMAGE_TAG
          script: |
            set -e
            cd /home/debian/whip/prod

            # Login to GHCR
            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GITHUB_USERNAME}" --password-stdin 2>/dev/null || \
              docker login ghcr.io -u "${GITHUB_USERNAME}" -p "${GHCR_TOKEN}"

            # Pull and restart the site service
            TAG=${IMAGE_TAG} GITHUB_USERNAME=${GITHUB_USERNAME} docker compose -f docker-compose.prod.yml pull whip-site
            TAG=${IMAGE_TAG} GITHUB_USERNAME=${GITHUB_USERNAME} docker compose -f docker-compose.prod.yml up -d --force-recreate whip-site

            # Sync Prisma schema additively (no migrations folder yet —
            # uses db push without --accept-data-loss so it refuses any
            # destructive operation).
            sleep 5
            docker compose -f docker-compose.prod.yml exec -T whip-site \
              npx prisma db push --skip-generate || \
              echo "[warn] prisma db push failed — run manually if needed"

            # Cleanup
            docker image prune -f

            # Health check
            sleep 5
            docker ps | grep whip-site

      - name: Deployment Summary
        run: |
          echo "## Deployment Summary (PROD)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | **PRODUCTION** |" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | \`${{ steps.config.outputs.tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Path | \`/home/debian/whip/prod/\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ✅ Deployed |" >> $GITHUB_STEP_SUMMARY

  deploy-dev:
    name: Deploy to DEV
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: read
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/dev') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action != 'build' && github.event.inputs.environment == 'dev')

    steps:
      - name: Determine tag
        id: config
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ needs.build.outputs.image_tag || 'dev' }}" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to VPS DEV
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ env.IMAGE_OWNER }}
          IMAGE_TAG: ${{ steps.config.outputs.tag }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_TOKEN,GITHUB_USERNAME,IMAGE_TAG
          script: |
            set -e
            cd /home/debian/whip/dev

            # Login to GHCR
            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GITHUB_USERNAME}" --password-stdin 2>/dev/null || \
              docker login ghcr.io -u "${GITHUB_USERNAME}" -p "${GHCR_TOKEN}"

            # Pull and restart the site service
            TAG=${IMAGE_TAG} GITHUB_USERNAME=${GITHUB_USERNAME} docker compose -f docker-compose.dev.yml pull whip-site-dev
            TAG=${IMAGE_TAG} GITHUB_USERNAME=${GITHUB_USERNAME} docker compose -f docker-compose.dev.yml up -d --force-recreate whip-site-dev

            # Apply Prisma schema (creates dll_watermarks etc. on first
            # deploy, no-op once migrations align). --accept-data-loss is
            # safe for dev only — never use in prod.
            sleep 5
            docker compose -f docker-compose.dev.yml exec -T whip-site-dev \
              npx prisma db push --skip-generate --accept-data-loss || \
              echo "[warn] prisma db push failed — run manually if needed"

            # Cleanup
            docker image prune -f

            # Health check
            sleep 5
            docker ps | grep whip-site-dev

      - name: Deployment Summary
        run: |
          echo "## Deployment Summary (DEV)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | **DEVELOPMENT** |" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | \`${{ steps.config.outputs.tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Path | \`/home/debian/whip/dev/\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ✅ Deployed |" >> $GITHUB_STEP_SUMMARY
